name: CI

on:
  push:
    branches: [master, main, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" "https://github.com/${GITHUB_REPOSITORY}.git" source

      - name: Install backend dependencies
        working-directory: source/backend
        run: |
          python3.12 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        working-directory: source/backend
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Mypy
        working-directory: source/backend
        run: |
          . .venv/bin/activate
          mypy app

      - name: Pytest
        working-directory: source/backend
        run: |
          . .venv/bin/activate
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" "https://github.com/${GITHUB_REPOSITORY}.git" source

      - name: Install frontend dependencies
        working-directory: source/frontend
        run: npm ci

      - name: ESLint
        working-directory: source/frontend
        run: npm run lint

      - name: Vitest
        working-directory: source/frontend
        run: npm run test -- --run

      - name: Production build
        working-directory: source/frontend
        run: npm run build
