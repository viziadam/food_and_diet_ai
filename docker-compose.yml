services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: food_ai
      POSTGRES_USER: food_ai
      POSTGRES_PASSWORD: food_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_ai -d food_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://food_ai:food_ai@db:5432/food_ai
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      AUTO_CREATE_SCHEMA: "true"
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
